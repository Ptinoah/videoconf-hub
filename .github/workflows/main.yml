name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Définit le répertoire de travail par défaut pour toutes les étapes "run" de ce job
    defaults:
      run:
        working-directory: ./VideoConf-Hub
    
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
          VITE_CHANNELS_ID: ${{ vars.VITE_CHANNELS_ID }}
        run: npm run build

      - name: Copy 404 page for react-router
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Important : le chemin doit inclure le sous-dossier car l'action 
          # upload-pages-artifact s'exécute à la racine du dépôt
          path: ./VideoConf-Hub/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
